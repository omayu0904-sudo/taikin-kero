<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root { --paper:#FFF9EE; --ink:#4A3B33; --soft:#8C7A6E; --green:#b9e4a0; --pink:#F6C7CF; --butter:#FBE6A6; }
  body { margin: 0; padding: 20px 22px; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif; font-size: 14px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--soft); font-size: 13px; }
  fieldset { border: 2px solid var(--ink); border-radius: 14px; margin: 0 0 12px; padding: 10px 14px 12px; background: #fffdf8; }
  legend { padding: 0 6px; font-weight: bold; }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  input[type=time] { font: inherit; padding: 3px 6px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .days label { margin: 0; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; background: #fff; cursor: pointer; }
  .days input { display: none; }
  .days input:checked + span { font-weight: bold; }
  .days label:has(input:checked) { background: var(--green); }
  input[type=range] { width: 160px; }
  button { font: inherit; font-weight: bold; margin-top: 6px; padding: 8px 22px; border: 2.5px solid var(--ink); border-radius: 14px;
    background: var(--butter); color: var(--ink); cursor: pointer; box-shadow: 2px 3px 0 var(--ink); }
  button:active { transform: translate(2px,3px); box-shadow: none; }
</style>
</head>
<body>
<h1>退勤ケロ 🐸</h1>
<p class="sub">はじめに時間と出勤する曜日を決めてね。あとから右クリック → 設定 で変えられます。</p>

<fieldset>
  <legend>時間</legend>
  <label>出勤 <input type="time" id="start"></label>
  <label>退勤 <input type="time" id="end"></label>
</fieldset>

<fieldset>
  <legend>出勤する曜日</legend>
  <div class="days" id="days"></div>
</fieldset>

<fieldset>
  <legend>見た目と音</legend>
  <label>大きさ <input type="range" id="size" min="0.6" max="1.6" step="0.1"> <span id="sizeV"></span></label>
  <label><input type="checkbox" id="sound"> 音を出す</label>
  <label><input type="checkbox" id="soundWork"> 勤務中のケロケロ(30分ごと)</label>
  <label><input type="checkbox" id="alwaysOnTop"> 常に手前に表示</label>
  <label><input type="checkbox" id="autoLaunch"> 起動時に自動実行</label>
</fieldset>

<button id="save">これでOK！</button>

<script>
const { ipcRenderer } = require('electron');
const $ = id => document.getElementById(id);
const names = ['日', '月', '火', '水', '木', '金', '土'];
const daysEl = $('days');
names.forEach((n, i) => {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" value="${i}"><span>${n}</span>`;
  daysEl.appendChild(l);
});
$('size').addEventListener('input', () => $('sizeV').textContent = 'x' + $('size').value);

ipcRenderer.on('config', (_e, c) => {
  $('start').value = c.start; $('end').value = c.end;
  daysEl.querySelectorAll('input').forEach(i => i.checked = c.days.includes(Number(i.value)));
  $('size').value = c.size; $('sizeV').textContent = 'x' + c.size;
  ['sound', 'soundWork', 'alwaysOnTop', 'autoLaunch'].forEach(k => $(k).checked = !!c[k]);
});

$('save').addEventListener('click', () => {
  ipcRenderer.send('save-config', {
    start: $('start').value || '09:00',
    end: $('end').value || '18:00',
    days: [...daysEl.querySelectorAll('input:checked')].map(i => Number(i.value)),
    size: Number($('size').value),
    sound: $('sound').checked, soundWork: $('soundWork').checked,
    alwaysOnTop: $('alwaysOnTop').checked, autoLaunch: $('autoLaunch').checked,
  });
});
</script>
</body>
</html>
