<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif; }
  #wrap { width: 240px; height: 220px; position: relative; cursor: pointer; transform-origin: top left; }
  #bubble { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); white-space: nowrap;
    background: #fffdf8; color: #4a3b33; border: 2.5px solid #4a3b33; border-radius: 22px 18px 22px 18px;
    padding: 4px 14px 5px; font-size: 15px; font-weight: bold; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px; margin-left: -6px;
    background: #fffdf8; border-right: 2.5px solid #4a3b33; border-bottom: 2.5px solid #4a3b33; transform: rotate(45deg); }
  #frog { position: absolute; left: 50px; bottom: 4px; overflow: visible; }
  #body { transform-box: fill-box; transform-origin: 50% 100%; }

  .lids, .zzz { display: none; }
  .lie .pupils { display: none; }
  .lie .lids { display: inline; }
  .lie .zzz { display: inline; animation: zzz 2.4s ease-in-out infinite; }
  .lie #body { transform: scaleY(.84); }

  .work #body { animation: wiggle 1.3s ease-in-out infinite; }
  .leave #body { animation: hop .7s ease-in-out infinite; }
  .leave .mouth { d: path("M54 72 Q70 94 86 72 Z"); fill: #e8788a; }
  .over #body { animation: shake .18s linear infinite; }
  .over #frog { filter: drop-shadow(0 0 7px #fff176) drop-shadow(0 0 14px #fff176); }
  .over .pupils circle:nth-child(-n+2) { r: 3.5; }
  .clicked #body { animation: hop .45s ease-out 1 !important; }

  @keyframes wiggle { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.06,.9); } 45% { transform: translateY(-44px) scale(.95,1.08); } }
  @keyframes shake { 0%,100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
  @keyframes zzz { 0%,100% { opacity: 0; transform: translateY(4px); } 50% { opacity: 1; transform: translateY(-4px); } }
  @keyframes fall { to { transform: translate(var(--dx), 210px) rotate(540deg); opacity: .9; } }
  .conf { position: absolute; top: -10px; width: 8px; height: 12px; border-radius: 2px; animation: fall 2.2s ease-in forwards; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bubble">…</div>
  <svg id="frog" class="lie" viewBox="0 0 140 130" width="140" height="130">
    <g id="body" stroke="#4a3b33" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="36" cy="120" rx="18" ry="7" fill="#9fd486"/>
      <ellipse cx="104" cy="120" rx="18" ry="7" fill="#9fd486"/>
      <circle cx="44" cy="42" r="19" fill="#b9e4a0"/>
      <circle cx="96" cy="42" r="19" fill="#b9e4a0"/>
      <ellipse cx="70" cy="80" rx="52" ry="42" fill="#b9e4a0"/>
      <ellipse cx="70" cy="94" rx="30" ry="24" fill="#effad8" stroke="none"/>
      <ellipse cx="20" cy="94" rx="11" ry="8" fill="#a6d98b" transform="rotate(-20 20 94)"/>
      <ellipse cx="120" cy="94" rx="11" ry="8" fill="#a6d98b" transform="rotate(20 120 94)"/>
      <circle cx="44" cy="43" r="13" fill="#fff" stroke-width="2.5"/>
      <circle cx="96" cy="43" r="13" fill="#fff" stroke-width="2.5"/>
      <g class="pupils" stroke="none">
        <circle cx="46" cy="45" r="6.5" fill="#4a3b33"/>
        <circle cx="94" cy="45" r="6.5" fill="#4a3b33"/>
        <circle cx="48" cy="42.5" r="2.2" fill="#fff"/>
        <circle cx="96" cy="42.5" r="2.2" fill="#fff"/>
      </g>
      <g class="lids" fill="none" stroke-width="2.8">
        <path d="M34 45 Q44 52 54 45"/>
        <path d="M86 45 Q96 52 106 45"/>
      </g>
      <ellipse cx="30" cy="76" rx="9" ry="6" fill="#f6c7cf" stroke="none"/>
      <ellipse cx="110" cy="76" rx="9" ry="6" fill="#f6c7cf" stroke="none"/>
      <circle cx="64" cy="64" r="1.6" fill="#4a3b33" stroke="none"/>
      <circle cx="76" cy="64" r="1.6" fill="#4a3b33" stroke="none"/>
      <path class="mouth" d="M56 72 Q70 84 84 72" fill="none" stroke-width="2.8"/>
    </g>
    <g class="zzz" fill="#6f9cc3" font-size="16" font-weight="bold" stroke="none">
      <text x="108" y="20">z</text><text x="120" y="8" font-size="12">z</text>
    </g>
  </svg>
</div>

<script>
const { ipcRenderer } = require('electron');
const wrap = document.getElementById('wrap');
const frog = document.getElementById('frog');
const bubble = document.getElementById('bubble');
let cfg = null, forced = null, forcedUntil = 0, prev = null;

// ---------- 音(WebAudioで合成。音声ファイル不要) ----------
let ac;
const ctx = () => ac || (ac = new AudioContext());
function chirp(t, f0, f1, dur, vol = 0.16, type = 'triangle') {
  const c = ctx(), o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const SND = {
  kero() { const t = ctx().currentTime; chirp(t, 280, 520, .11); chirp(t + .15, 430, 240, .17); },
  start() { const t = ctx().currentTime; chirp(t, 260, 400, .1); chirp(t + .14, 330, 520, .12); },
  leave() { const t = ctx().currentTime; [523, 659, 784, 1047].forEach((f, i) => chirp(t + i * .12, f, f * 1.02, .16, .14, 'square')); chirp(t + .55, 300, 560, .12); },
  over()  { const t = ctx().currentTime; chirp(t, 600, 200, .5, .14, 'sawtooth'); chirp(t + .55, 500, 180, .5, .12, 'sawtooth'); },
};
function play(name) { if (cfg && cfg.sound) { try { SND[name](); } catch (e) {} } }

// ---------- 状態計算 ----------
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const fmt = min => min >= 60 ? (min % 60 ? `${Math.floor(min / 60)}時間${min % 60}分` : `${Math.floor(min / 60)}時間`) : `${min}分`;

function compute() {
  const d = new Date();
  const now = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  const s = toMin(cfg.start), e = toMin(cfg.end);
  if (!cfg.days.includes(d.getDay())) return { state: 'lie', text: 'おやすみの日', key: 'off' };
  if (now < s) return { state: 'lie', text: `出勤まで ${fmt(Math.ceil(s - now))}`, key: 'before' };
  if (now < e) return { state: 'work', text: `退勤まで ${fmt(Math.ceil(e - now))}`, key: 'work' };
  if (now < e + 5) return { state: 'leave', text: 'ケロ〜！おつかれ！', key: 'leave' };
  return { state: 'over', text: 'まだいるの？！', key: 'over' };
}

function confetti() {
  const colors = ['#f6c7cf', '#fbe6a6', '#cfe3f2', '#cde7c2'];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('div');
    c.className = 'conf';
    c.style.left = (10 + Math.random() * 220) + 'px';
    c.style.background = colors[i % 4];
    c.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    c.style.animationDelay = (Math.random() * .6) + 's';
    wrap.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}

let lastHalf = -1;
function tick() {
  if (!cfg) return;
  let r;
  if (forced && Date.now() < forcedUntil) {
    r = { state: forced, key: 'pv-' + forced, text: forced === 'leave' ? 'ケロ〜！おつかれ！' : 'まだいるの？！' };
  } else { forced = null; r = compute(); }

  frog.setAttribute('class', r.state);
  bubble.textContent = r.text;

  if (r.key !== prev) {
    if (prev !== null) {
      if (r.key === 'work') play('start');
      if (r.key === 'leave' || r.key === 'pv-leave') { play('leave'); confetti(); }
      if (r.key === 'over' || r.key === 'pv-over') play('over');
    }
    prev = r.key;
  }
  // 勤務中は30分ごとに小さく「ケロ」
  const d = new Date();
  if (r.key === 'work' && cfg.soundWork && d.getSeconds() === 0 && d.getMinutes() % 30 === 0 && lastHalf !== d.getMinutes() + d.getHours() * 60) {
    lastHalf = d.getMinutes() + d.getHours() * 60;
    play('kero');
  }
}
setInterval(tick, 1000);

// ---------- 操作: クリックでジャンプ / ドラッグで移動 / 右クリックでメニュー ----------
let down = null, moved = false;
wrap.addEventListener('mousedown', e => { if (e.button !== 0) return; down = { x: e.screenX, y: e.screenY }; moved = false; });
window.addEventListener('mousemove', e => {
  if (!down) return;
  const dx = e.screenX - down.x, dy = e.screenY - down.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  if (moved) { ipcRenderer.send('drag-move', { dx, dy }); down = { x: e.screenX, y: e.screenY }; }
});
window.addEventListener('mouseup', () => {
  if (down && !moved) {
    frog.classList.add('clicked'); play('kero');
    setTimeout(() => frog.classList.remove('clicked'), 500);
  }
  down = null;
});
wrap.addEventListener('contextmenu', e => { e.preventDefault(); ipcRenderer.send('contextmenu'); });

ipcRenderer.on('config', (_e, c) => {
  cfg = c;
  document.body.style.zoom = c.size;
  tick();
});
ipcRenderer.on('preview', (_e, st) => { forced = st; forcedUntil = Date.now() + 6000; prev = null; tick(); });
</script>
</body>
</html>
